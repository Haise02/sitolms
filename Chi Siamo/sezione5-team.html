<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap');

.elementor-widget-html { margin: 0 !important; padding: 0 !important; }
.elementor-widget-container { margin: 0 !important; padding: 0 !important; }

.cs-team {
  --accent: #4C7BF4;
  --accent2: #7B5CF5;
  --beige: #D4C5B0;
  background: transparent;
  padding: 80px 0 60px;
  font-family: 'Inter', sans-serif;
  overflow: hidden;
}

.cs-team-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 40px;
}

/* Header */
.cs-team-header {
  text-align: center;
  margin-bottom: 48px;
  opacity: 0;
  transform: translateY(30px);
}
.cs-team-header.cs-vis { animation: csTeamUp 0.8s ease forwards; }

.cs-team-label {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 12px;
  font-weight: 600;
  color: var(--accent);
  letter-spacing: 2px;
  text-transform: uppercase;
  margin-bottom: 16px;
}
.cs-team-label::before,
.cs-team-label::after {
  content: '';
  width: 20px;
  height: 1px;
  background: var(--accent);
}

.cs-team h2 {
  font-family: 'Cormorant Garamond', serif;
  font-size: 52px;
  font-weight: 600;
  color: #ffffff;
  margin: 0 0 16px;
  line-height: 1.15;
}
.cs-team h2 em { font-style: italic; color: var(--beige); }

.cs-team-subtitle {
  font-size: 17px;
  font-weight: 300;
  color: rgba(255,255,255,0.5);
  max-width: 600px;
  margin: 0 auto;
  line-height: 1.6;
}

/* ========== IMAGE ITEM ========== */
.cs-timg {
  position: relative;
  cursor: default;
}
.cs-timg img {
  width: 100%;
  height: auto;
  display: block;
  border-radius: 16px;
  transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
  filter: brightness(0.95);
  position: relative;
  z-index: 2;
}
.cs-timg:hover img {
  transform: translateY(-6px) scale(1.03);
  filter: brightness(1.1);
  box-shadow: 0 16px 40px rgba(0,0,0,0.35), 0 0 30px rgba(76,123,244,0.1);
}

/* ========== ROW 1: Leadership (30% - 40% - 30%) ========== */
.cs-row-leadership {
  display: flex;
  align-items: flex-end;
  justify-content: center;
  gap: 20px;
  margin-bottom: 28px;
  opacity: 0;
  transform: translateY(30px);
}
.cs-row-leadership.cs-vis { animation: csTeamUp 0.8s ease forwards 0.1s; }

.cs-row-leadership .cs-lead-side {
  flex: 0 0 28%;
  max-width: 28%;
}
.cs-row-leadership .cs-lead-center {
  flex: 0 0 38%;
  max-width: 38%;
}

/* ========== ROW 2: Management (20% 30% 30% 20%) ========== */
.cs-row-mgmt {
  display: grid;
  grid-template-columns: 20% 30% 30% 20%;
  align-items: end;
  gap: 0;
  justify-content: center;
  margin-bottom: 20px;
  opacity: 0;
  transform: translateY(30px);
}
.cs-row-mgmt.cs-vis { animation: csTeamUp 0.8s ease forwards 0.2s; }
.cs-row-mgmt2 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 18px;
  margin-bottom: 48px;
  opacity: 0;
  transform: translateY(30px);
}
.cs-row-mgmt2.cs-vis { animation: csTeamUp 0.8s ease forwards 0.25s; }

/* ========== CAROUSEL ========== */
.cs-carousel-wrap {
  position: relative;
  width: 100vw;
  left: 50%;
  transform: translateX(-50%);
  overflow: hidden;
  margin-bottom: 14px;
  padding: 6px 0;
}

.cs-carousel-wrap::before,
.cs-carousel-wrap::after {
  content: '';
  position: absolute;
  top: 0;
  bottom: 0;
  width: 80px;
  z-index: 5;
  pointer-events: none;
}
.cs-carousel-wrap::before {
  left: 0;
  background: linear-gradient(to right, #05052A, transparent);
}
.cs-carousel-wrap::after {
  right: 0;
  background: linear-gradient(to left, #05052A, transparent);
}

.cs-carousel-track {
  display: flex;
  gap: 16px;
  width: max-content;
}

.cs-carousel-track .cs-timg {
  flex-shrink: 0;
  width: 260px;
}

/* Animations */
.cs-carousel-track--right {
  animation: csScrollRight 45s linear infinite;
}
.cs-carousel-track--left {
  animation: csScrollLeft 45s linear infinite;
}
.cs-carousel-track--right2 {
  animation: csScrollRight 48s linear infinite;
}
.cs-carousel-track--left2 {
  animation: csScrollLeft 48s linear infinite;
}

/* Pause on hover */
.cs-carousel-wrap:hover .cs-carousel-track {
  animation-play-state: paused;
}

@keyframes csScrollRight {
  0% { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}
@keyframes csScrollLeft {
  0% { transform: translateX(-50%); }
  100% { transform: translateX(0); }
}
@keyframes csTeamUp {
  to { opacity: 1; transform: translateY(0); }
}

/* ========== Responsive ========== */
@media (max-width: 1024px) {
  .cs-row-mgmt, .cs-row-mgmt2 { grid-template-columns: repeat(4, 1fr); }
  .cs-carousel-track .cs-timg { width: 230px; }
}

@media (max-width: 768px) {
  .cs-team { padding: 60px 0 40px; }
  .cs-team-inner { padding: 0 20px; }
  .cs-team h2 { font-size: 36px; }
  .cs-row-leadership { gap: 16px; flex-wrap: wrap; justify-content: center; }
  .cs-row-leadership .cs-lead-center { flex: 0 0 60%; max-width: 60%; order: -1; }
  .cs-row-leadership .cs-lead-side { flex: 0 0 42%; max-width: 42%; }
  .cs-row-mgmt, .cs-row-mgmt2 { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  .cs-carousel-track .cs-timg { width: 200px; }
  .cs-carousel-wrap::before,
  .cs-carousel-wrap::after { width: 40px; }
}

@media (max-width: 480px) {
  .cs-team { padding: 40px 0 30px; }
  .cs-team-inner { padding: 0 16px; }
  .cs-team h2 { font-size: 30px; }
  .cs-row-leadership { gap: 10px; flex-wrap: wrap; justify-content: center; }
  .cs-row-leadership .cs-lead-center { flex: 0 0 65%; max-width: 65%; order: -1; }
  .cs-row-leadership .cs-lead-side { flex: 0 0 44%; max-width: 44%; }
  .cs-row-mgmt, .cs-row-mgmt2 { grid-template-columns: repeat(2, 1fr); gap: 8px; }
  .cs-carousel-track .cs-timg { width: 180px; }
  .cs-carousel-wrap::before,
  .cs-carousel-wrap::after { width: 24px; }
}
</style>

<script>
(function(){
  if('IntersectionObserver' in window){
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('cs-vis');
          obs.unobserve(entry.target);
        }
      });
    }, {threshold: 0.08});
    document.querySelectorAll('.cs-team-header, .cs-row-leadership, .cs-row-mgmt, .cs-row-mgmt2').forEach(function(el){ obs.observe(el); });
  } else {
    document.querySelectorAll('.cs-team-header, .cs-row-leadership, .cs-row-mgmt, .cs-row-mgmt2').forEach(function(el){ el.classList.add('cs-vis'); });
  }
})();
</script>
