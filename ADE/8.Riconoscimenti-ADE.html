<meta charset="UTF-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>
.ade-riconoscimenti,
.ade-riconoscimenti * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

.ade-riconoscimenti {
    font-family: 'Inter', sans-serif;
    background: transparent;
    color: #1a1a1a;
    width: 100%;
    padding: 0 40px 40px;
}

.ade-riconoscimenti-inner {
    max-width: 560px;
    margin: 0 auto;
    text-align: center;
}

.ade-riconoscimenti-intro {
    font-size: 18px;
    line-height: 1.8;
    color: rgba(26, 26, 26, 0.7);
    margin-bottom: 32px;
}

/* Card */
.ade-ric-card {
    background: #ffffff;
    border: 1px solid rgba(0, 0, 0, 0.08);
    border-radius: 20px;
    overflow: hidden;
    box-shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
    transition: all 0.35s ease;
    text-align: center;
}

.ade-ric-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 12px 40px rgba(0, 0, 0, 0.1);
}

/* Icon area */
.ade-ric-icon {
    width: 72px;
    height: 72px;
    border-radius: 16px;
    background: linear-gradient(135deg, #193054 0%, #2a4a7f 40%, #c8bb98 100%);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 32px auto 0;
}

.ade-ric-icon svg {
    width: 32px;
    height: 32px;
    stroke: #ffffff;
    stroke-width: 1.8;
    fill: none;
}

/* Content */
.ade-ric-body {
    padding: 24px 32px 32px;
}

.ade-ric-body h3 {
    font-family: 'Inter', sans-serif;
    font-size: 22px;
    font-weight: 700;
    line-height: 1.35;
    color: #1a1a1a;
    margin-bottom: 8px;
}

.ade-ric-body h3 em {
    font-weight: 400;
    font-style: italic;
    color: rgba(26, 26, 26, 0.6);
}

.ade-ric-body p {
    font-size: 15px;
    line-height: 1.7;
    color: rgba(26, 26, 26, 0.6);
}

/* Responsive */
@media (max-width: 768px) {
    .ade-riconoscimenti {
        padding: 0 24px 32px;
    }

    .ade-riconoscimenti-intro {
        font-size: 16px;
        margin-bottom: 24px;
    }

    .ade-ric-icon {
        width: 60px;
        height: 60px;
        border-radius: 14px;
        margin-top: 28px;
    }

    .ade-ric-icon svg {
        width: 28px;
        height: 28px;
    }

    .ade-ric-body {
        padding: 20px 24px 28px;
    }

    .ade-ric-body h3 {
        font-size: 20px;
    }

    .ade-ric-body p {
        font-size: 14px;
    }
}

@media (max-width: 480px) {
    .ade-riconoscimenti {
        padding: 0 16px 24px;
    }

    .ade-ric-body {
        padding: 18px 20px 24px;
    }

    .ade-ric-body h3 {
        font-size: 18px;
    }
}
</style>

<div class="ade-riconoscimenti">
    <div class="ade-riconoscimenti-inner">
        <p class="ade-riconoscimenti-intro">Al termine del programma ADE riceverai:</p>

        <div class="ade-ric-card">
            <div class="ade-ric-icon">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                    <path d="M9 15l2 2 4-4"/>
                </svg>
            </div>
            <div class="ade-ric-body">
                <h3>Attestato di partecipazione <em>Leone Master School</em></h3>
                <p>Che certifica le competenze acquisite nel Programma.</p>
            </div>
        </div>
    </div>
</div>
