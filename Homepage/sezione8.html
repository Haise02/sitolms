<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Partner Bento Box</title>
<style>
  .lms-partners {
    --bg: #05052A;
    --card: rgba(255, 255, 255, 0.035);
    --card-hover: rgba(255, 255, 255, 0.07);
    --border: rgba(255, 255, 255, 0.06);
    --border-hover: rgba(100, 140, 255, 0.35);
    --glow: rgba(80, 120, 255, 0.12);
    --accent: #4C7BF4;
    --accent2: #7B5CF5;
    background: var(--bg);
    padding: 70px 24px;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  .lms-partners *,
  .lms-partners *::before,
  .lms-partners *::after {
    margin: 0; padding: 0; box-sizing: border-box;
  }

  .lms-grid-wrap {
    max-width: 1100px;
    margin: 0 auto;
  }

  /* ══════════════════════════════════════
     DESKTOP FISSO — 4 colonne, 4 righe
     Riga 1: [  1 wide  ] [ 2 ] [ 3 ]
     Riga 2: [ 4 ] [ 5 ] [  6 wide  ]
     Riga 3: [ 7 ] [  8 wide  ] [ 9 ]
     Riga 4: [  10 wide ] [ 11 wide ]
     ══════════════════════════════════════ */
  .lms-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    grid-template-rows: repeat(4, 170px);
    grid-template-areas:
      "a1 a1 a2 a3"
      "a4 a5 a6 a6"
      "a7 a8 a8 a9"
      "a10 a10 a11 a11";
    gap: 14px;
  }

  .lms-c1  { grid-area: a1; }
  .lms-c2  { grid-area: a2; }
  .lms-c3  { grid-area: a3; }
  .lms-c4  { grid-area: a4; }
  .lms-c5  { grid-area: a5; }
  .lms-c6  { grid-area: a6; }
  .lms-c7  { grid-area: a7; }
  .lms-c8  { grid-area: a8; }
  .lms-c9  { grid-area: a9; }
  .lms-c10 { grid-area: a10; }
  .lms-c11 { grid-area: a11; }

  /* ── CARD ── */
  .lms-card {
    position: relative;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    cursor: default;
    transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
    opacity: 0;
    transform: translateY(30px);
  }

  .lms-card.lms-visible { animation: lmsReveal 0.6s ease-out forwards; }
  .lms-card:nth-child(1).lms-visible  { animation-delay: 0.04s; }
  .lms-card:nth-child(2).lms-visible  { animation-delay: 0.10s; }
  .lms-card:nth-child(3).lms-visible  { animation-delay: 0.16s; }
  .lms-card:nth-child(4).lms-visible  { animation-delay: 0.22s; }
  .lms-card:nth-child(5).lms-visible  { animation-delay: 0.28s; }
  .lms-card:nth-child(6).lms-visible  { animation-delay: 0.34s; }
  .lms-card:nth-child(7).lms-visible  { animation-delay: 0.40s; }
  .lms-card:nth-child(8).lms-visible  { animation-delay: 0.46s; }
  .lms-card:nth-child(9).lms-visible  { animation-delay: 0.52s; }
  .lms-card:nth-child(10).lms-visible { animation-delay: 0.58s; }
  .lms-card:nth-child(11).lms-visible { animation-delay: 0.64s; }

  @keyframes lmsReveal {
    to { opacity: 1; transform: translateY(0); }
  }

  /* Radial glow - cursor tracking */
  .lms-card::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: radial-gradient(
      350px circle at var(--mx, 50%) var(--my, 50%),
      var(--glow), transparent 70%
    );
    opacity: 0;
    transition: opacity 0.4s ease;
    pointer-events: none;
    z-index: 1;
  }

  /* Gradient border on hover */
  .lms-card::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    padding: 1px;
    background: linear-gradient(135deg,
      rgba(76, 123, 244, 0.45),
      rgba(123, 92, 245, 0.25),
      transparent 55%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    opacity: 0;
    transition: opacity 0.45s ease;
    pointer-events: none;
    z-index: 2;
  }

  .lms-card:hover {
    background: var(--card-hover);
    border-color: var(--border-hover);
    transform: translateY(-5px) scale(1.015);
    box-shadow:
      0 25px 50px rgba(0, 0, 0, 0.35),
      0 0 50px rgba(76, 123, 244, 0.07);
  }
  .lms-card:hover::after  { opacity: 1; }
  .lms-card:hover::before { opacity: 1; }

  /* ── LOGO ── */
  .lms-logo {
    padding: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
    height: 100%;
    position: relative;
    z-index: 3;
  }

  .lms-logo img {
    max-width: 65%;
    max-height: 60px;
    object-fit: contain;
    filter: brightness(0.55) grayscale(100%);
    opacity: 0.5;
    transition: all 0.45s cubic-bezier(0.25, 1, 0.5, 1);
  }

  .lms-card:hover .lms-logo img {
    filter: brightness(1) grayscale(0%);
    opacity: 1;
    transform: scale(1.06);
  }

  /* ── Shimmer ── */
  .lms-shine {
    position: absolute;
    top: 0;
    left: -100%;
    width: 100%;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--accent), var(--accent2), transparent);
    z-index: 4;
    pointer-events: none;
  }
  .lms-card:hover .lms-shine {
    animation: lmsShimmer 0.8s ease-out forwards;
  }
  @keyframes lmsShimmer { to { left: 100%; } }

  /* ══════════════════════════════════
     MOBILE ≤ 640px: 2 colonne, flow
     ══════════════════════════════════ */
  @media (max-width: 640px) {
    .lms-partners { padding: 48px 14px; }
    .lms-grid {
      grid-template-columns: repeat(2, 1fr);
      grid-template-rows: auto;
      grid-template-areas:
        "a1  a2"
        "a3  a4"
        "a5  a6"
        "a7  a8"
        "a9  a10"
        "a11 a11";
      grid-auto-rows: 120px;
      gap: 10px;
    }
    .lms-logo { padding: 20px; }
    .lms-logo img { max-width: 72%; max-height: 48px; }
  }

  /* ══════════════════════════════════
     SMALL MOBILE ≤ 380px
     ══════════════════════════════════ */
  @media (max-width: 380px) {
    .lms-partners { padding: 36px 10px; }
    .lms-grid { gap: 8px; }
    .lms-card { border-radius: 14px; }
    .lms-card::after { border-radius: 14px; }
    .lms-card::before { border-radius: 14px; }
    .lms-logo { padding: 16px; }
    .lms-logo img { max-width: 78%; max-height: 40px; }
  }
</style>
</head>
<body style="margin:0;background:#05052A;">

<div class="lms-partners">
  <div class="lms-grid-wrap">
    <div class="lms-grid">

      <div class="lms-card lms-c1">
        <div class="lms-shine"></div>
        <div class="lms-logo"><img src="https://leonemasterschool.it/wp-content/uploads/2026/02/Prime-Video-Logo-PNG-scaled.png" alt="Partner 1"></div>
      </div>

      <div class="lms-card lms-c2">
        <div class="lms-shine"></div>
        <div class="lms-logo"><img src="https://leonemasterschool.it/wp-content/uploads/2026/02/yahoo.png" alt="Partner 2"></div>
      </div>

      <div class="lms-card lms-c3">
        <div class="lms-shine"></div>
        <div class="lms-logo"><img src="https://leonemasterschool.it/wp-content/uploads/2026/02/rds.png" alt="Partner 3"></div>
      </div>

      <div class="lms-card lms-c4">
        <div class="lms-shine"></div>
        <div class="lms-logo"><img src="https://leonemasterschool.it/wp-content/uploads/2026/02/rete4.png" alt="Partner 4"></div>
      </div>

      <div class="lms-card lms-c5">
        <div class="lms-shine"></div>
        <div class="lms-logo"><img src="https://leonemasterschool.it/wp-content/uploads/2026/02/rai2.png" alt="Partner 5"></div>
      </div>

      <div class="lms-card lms-c6">
        <div class="lms-shine"></div>
        <div class="lms-logo"><img src="https://leonemasterschool.it/wp-content/uploads/2026/02/la7.png" alt="Partner 6"></div>
      </div>

      <div class="lms-card lms-c7">
        <div class="lms-shine"></div>
        <div class="lms-logo"><img src="https://leonemasterschool.it/wp-content/uploads/2026/02/milionaire.png" alt="Partner 7"></div>
      </div>

      <div class="lms-card lms-c8">
        <div class="lms-shine"></div>
        <div class="lms-logo"><img src="https://leonemasterschool.it/wp-content/uploads/2026/02/italia1.png" alt="Partner 8"></div>
      </div>

      <div class="lms-card lms-c9">
        <div class="lms-shine"></div>
        <div class="lms-logo"><img src="https://leonemasterschool.it/wp-content/uploads/2026/02/corrieredellasera.png" alt="Partner 9"></div>
      </div>

      <div class="lms-card lms-c10">
        <div class="lms-shine"></div>
        <div class="lms-logo"><img src="https://leonemasterschool.it/wp-content/uploads/2026/02/iltempo.png" alt="Partner 10"></div>
      </div>

      <div class="lms-card lms-c11">
        <div class="lms-shine"></div>
        <div class="lms-logo"><img src="https://leonemasterschool.it/wp-content/uploads/2026/02/rai2.png" alt="Partner 11"></div>
      </div>

    </div>
  </div>
</div>

<script>
(function(){
  document.querySelectorAll('.lms-card').forEach(function(c){
    c.addEventListener('mousemove', function(e){
      var r = c.getBoundingClientRect();
      c.style.setProperty('--mx', (e.clientX - r.left) + 'px');
      c.style.setProperty('--my', (e.clientY - r.top) + 'px');
    });
  });
  if('IntersectionObserver' in window){
    var obs = new IntersectionObserver(function(entries){
      entries.forEach(function(entry){
        if(entry.isIntersecting){
          entry.target.classList.add('lms-visible');
          obs.unobserve(entry.target);
        }
      });
    }, {threshold: 0.12});
    document.querySelectorAll('.lms-card').forEach(function(c){ obs.observe(c); });
  } else {
    document.querySelectorAll('.lms-card').forEach(function(c){ c.classList.add('lms-visible'); });
  }
})();
</script>

</body>
</html>
