<style>
@import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter+Tight:wght@300;400;500;600;700;800;900&display=swap');

.elementor-widget-html { margin: 0 !important; padding: 0 !important; }
.elementor-widget-container { margin: 0 !important; padding: 0 !important; }

.mms-summit {
  --navy: #07162E;
  --accent: #4C7BF4;
  --gold: #F5A623;
  --serif: 'Cormorant Garamond', Georgia, serif;
  --sans: 'Inter Tight', 'Inter', sans-serif;
  font-family: var(--sans);
  background: linear-gradient(160deg, var(--navy) 0%, #0d2440 50%, #112a4a 100%);
  color: #ffffff;
  padding: 100px 40px;
  position: relative;
  overflow: hidden;
  text-align: center;
}
.mms-summit::before {
  content: '';
  position: absolute;
  top: -200px; left: 50%; transform: translateX(-50%);
  width: 800px; height: 800px;
  background: radial-gradient(circle, rgba(245,166,35,0.08) 0%, transparent 60%);
  pointer-events: none;
}
.mms-summit-inner {
  max-width: 640px;
  margin: 0 auto;
  position: relative;
  z-index: 2;
}
.mms-summit-badge {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  font-weight: 700;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 20px;
}
.mms-summit-badge-dot {
  width: 6px; height: 6px;
  background: var(--gold);
  border-radius: 50%;
  animation: mmsPulse 2s ease-in-out infinite;
}
@keyframes mmsPulse {
  0%, 100% { opacity: 1; transform: scale(1); }
  50% { opacity: 0.4; transform: scale(0.8); }
}
.mms-summit h2 {
  font-family: var(--serif);
  font-size: 48px;
  font-weight: 600;
  line-height: 1.1;
  margin-bottom: 16px;
  letter-spacing: -1px;
}
.mms-summit h2 em {
  font-style: italic;
  color: var(--gold);
}
.mms-summit-desc {
  font-size: 18px;
  font-weight: 300;
  color: rgba(255,255,255,0.55);
  line-height: 1.7;
  margin-bottom: 40px;
}
.mms-summit-form {
  background: rgba(255,255,255,0.04);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 20px;
  padding: 40px 32px;
  backdrop-filter: blur(12px);
}
.mms-summit-form label,
.mms-summit-form .hs-form-field > label {
  color: rgba(255,255,255,0.7) !important;
  font-family: var(--sans) !important;
  font-size: 13px !important;
  font-weight: 500 !important;
}
.mms-summit-form input[type="text"],
.mms-summit-form input[type="email"],
.mms-summit-form input[type="tel"],
.mms-summit-form input[type="number"],
.mms-summit-form textarea,
.mms-summit-form select {
  background: rgba(255,255,255,0.06) !important;
  border: 1px solid rgba(255,255,255,0.12) !important;
  border-radius: 10px !important;
  color: #ffffff !important;
  padding: 12px 16px !important;
  font-family: var(--sans) !important;
  font-size: 15px !important;
  width: 100% !important;
  transition: border-color 0.2s ease;
}
.mms-summit-form input:focus,
.mms-summit-form textarea:focus,
.mms-summit-form select:focus {
  border-color: var(--gold) !important;
  outline: none !important;
}
.mms-summit-form input[type="submit"],
.mms-summit-form .hs-button {
  background: var(--gold) !important;
  color: var(--navy) !important;
  border: none !important;
  border-radius: 12px !important;
  padding: 16px 40px !important;
  font-family: var(--sans) !important;
  font-size: 15px !important;
  font-weight: 700 !important;
  cursor: pointer !important;
  transition: transform 0.2s ease, box-shadow 0.2s ease;
  margin-top: 8px !important;
}
.mms-summit-form input[type="submit"]:hover,
.mms-summit-form .hs-button:hover {
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(245,166,35,0.3) !important;
}
.mms-summit-form .hs-error-msg {
  color: #ff6b6b !important;
  font-size: 12px !important;
}

/* Reveal */
.mms-reveal {
  opacity: 0; transform: translateY(28px);
  transition: opacity 0.7s cubic-bezier(0.16,1,0.3,1), transform 0.7s cubic-bezier(0.16,1,0.3,1);
}
.mms-reveal.visible { opacity: 1; transform: translateY(0); }
.mms-reveal-d1 { transition-delay: 0.08s; }
.mms-reveal-d2 { transition-delay: 0.16s; }

/* Responsive */
@media (max-width: 768px) {
  .mms-summit { padding: 70px 24px; }
  .mms-summit h2 { font-size: 36px; }
  .mms-summit-desc { font-size: 16px; }
  .mms-summit-form { padding: 28px 20px; }
}
@media (max-width: 480px) {
  .mms-summit { padding: 56px 16px; }
  .mms-summit h2 { font-size: 28px; }
  .mms-summit-form { padding: 24px 16px; border-radius: 14px; }
}
</style>

<div class="mms-summit">
  <div class="mms-summit-inner">
    <div class="mms-summit-badge mms-reveal">
      <div class="mms-summit-badge-dot"></div>
      Evento esclusivo
    </div>
    <h2 class="mms-reveal mms-reveal-d1">Iscriviti alla lista d&rsquo;attesa per il prossimo <em>MMS Summit</em></h2>
    <p class="mms-summit-desc mms-reveal mms-reveal-d1">Lascia i tuoi dati per essere tra i primi a ricevere aggiornamenti, date e accesso prioritario al prossimo Money Maker Summit.</p>
    <div class="mms-summit-form mms-reveal mms-reveal-d2" id="mmsFormContainer"></div>
  </div>
</div>

<script charset="utf-8" type="text/javascript" src="//js-eu1.hsforms.net/forms/embed/v2.js"></script>
<script>
  hbspt.forms.create({
    portalId: "140603915",
    formId: "a8d535ac-8776-4ec3-8da8-b8bef5145bfd",
    region: "eu1",
    target: "#mmsFormContainer"
  });
</script>

<script>
(function(){
  var els = document.querySelectorAll('.mms-reveal');
  if (!els.length) return;
  var obs = new IntersectionObserver(function(entries){
    entries.forEach(function(e){
      if(e.isIntersecting){ e.target.classList.add('visible'); obs.unobserve(e.target); }
    });
  }, { threshold: 0.1 });
  els.forEach(function(el){ obs.observe(el); });
})();
</script>
