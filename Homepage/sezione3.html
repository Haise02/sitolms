<style>
/* Reset padding Elementor */
.elementor-widget-html {
    margin: 0 !important;
    padding: 0 !important;
}
.elementor-widget-container {
    margin: 0 !important;
    padding: 0 !important;
}

/* Iframe responsive wrapper */
.testimonial-slider-wrapper {
    position: relative;
    width: 100%;
    height: 1200px;
    overflow: hidden;
}

@media (max-width: 768px) and (orientation: portrait) {
    .testimonial-slider-wrapper {
        height: 1400px !important;
    }
}

@media (max-width: 480px) and (orientation: portrait) {
    .testimonial-slider-wrapper {
        height: 1100px !important;
    }
}
</style>

<div class="testimonial-slider-wrapper">
    <iframe 
        src="https://cdn.jsdelivr.net/gh/Haise02/sitolms@main/Homepage/testimonial-slider-extended/index.html"
        width="100%" 
        height="100%" 
        frameborder="0"
        scrolling="no"
        allow="touch"
        style="border: none; display: block; margin: 0; padding: 0; overflow: hidden; touch-action: auto;">
    </iframe>
</div>

<script>
// Auto-resize iframe based on content
window.addEventListener('message', function(e) {
    if (e.data.testimonialHeight) {
        const iframe = document.querySelector('iframe[src*="testimonial-slider-extended"]');
        if (iframe) {
            iframe.style.height = e.data.testimonialHeight + 'px';
        }
    }
});
</script>
